name: DogballWhisper
options:
  bundleIdPrefix: com.jonclegg
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    from: 0.15.4
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    from: 0.18.0

targets:
  DogballWhisper:
    type: application
    platform: macOS
    sources:
      - path: DogballWhisper
    dependencies:
      - package: FluidAudio
      - package: WhisperKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jonclegg.DogballWhisper
        PRODUCT_NAME: Dogball Whisper
        PRODUCT_MODULE_NAME: DogballWhisper
        # Placeholders. `scripts/release-macos.sh` overrides both on the
        # xcodebuild command line from the release tag, so a published build
        # reports the version someone can actually name in a bug report;
        # 0.0.0 is what a local `build-mac.sh` build reports, and it says
        # exactly what it is — a build nobody published.
        MARKETING_VERSION: "0.0.0"
        CURRENT_PROJECT_VERSION: "0"
        SWIFT_VERSION: "5.10"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Dogball Whisper records your voice while you hold the dictation key, and transcribes it on this Mac."
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Developer ID Application"
        DEVELOPMENT_TEAM: 22CTWHGWQQ
        CODE_SIGN_ENTITLEMENTS: DogballWhisper/DogballWhisper.entitlements
        ENABLE_APP_SANDBOX: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
      configs:
        # Hardened Runtime is required to notarize, and notarization is what
        # lets anyone but this machine open the app without Gatekeeper refusing
        # it. The microphone entitlement is the price of admission; sandboxing
        # stays off either way, because an Accessibility client cannot be
        # sandboxed.
        #
        # Release only, and that restriction is load-bearing: Hardened Runtime
        # refuses to load an injected library, so a hardened test host hangs
        # before the XCTest bundle can connect to it. Tests build Debug.
        Release:
          ENABLE_HARDENED_RUNTIME: YES
          # Without this, Xcode injects get-task-allow, which notarization rejects.
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
          # `xcodebuild build` signs without a secure timestamp, and the notary
          # service rejects the submission for it: "The signature does not
          # include a secure timestamp."
          OTHER_CODE_SIGN_FLAGS: "--timestamp"
        Debug:
          ENABLE_HARDENED_RUNTIME: NO

  DogballWhisperTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      - path: Tests/Fixtures
        buildPhase: resources
    dependencies:
      - target: DogballWhisper
    settings:
      base:
        SWIFT_VERSION: "5.10"
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Dogball Whisper.app/Contents/MacOS/Dogball Whisper"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  DogballWhisper:
    build:
      targets:
        DogballWhisper: all
        DogballWhisperTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DogballWhisperTests
