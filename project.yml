name: DogballWhisper
options:
  bundleIdPrefix: com.jonclegg
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    from: 0.15.4
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    from: 0.18.0

targets:
  DogballWhisper:
    type: application
    platform: macOS
    sources:
      - path: DogballWhisper
    dependencies:
      - package: FluidAudio
      - package: WhisperKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jonclegg.DogballWhisper
        PRODUCT_NAME: Dogball Whisper
        PRODUCT_MODULE_NAME: DogballWhisper
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.10"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Dogball Whisper records your voice while you hold the dictation key, and transcribes it on this Mac."
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Developer ID Application"
        DEVELOPMENT_TEAM: 22CTWHGWQQ
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO

  DogballWhisperTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      - path: Tests/Fixtures
        buildPhase: resources
    dependencies:
      - target: DogballWhisper
    settings:
      base:
        SWIFT_VERSION: "5.10"
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Dogball Whisper.app/Contents/MacOS/Dogball Whisper"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  DogballWhisper:
    build:
      targets:
        DogballWhisper: all
        DogballWhisperTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DogballWhisperTests
